[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognitive-tool-agent"
version = "0.1.0"
description = "Cognitive Graph Lab — Dataset-to-Agent-Architecture Lab"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "openai>=1.0",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cognitive_tool_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
